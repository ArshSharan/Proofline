name: Proofline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Quality and Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static lint analysis
        run: npm run lint --workspaces --if-present

      - name: Strict typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Core and lab unit tests
        run: npm run test --workspaces --if-present

      - name: Hardened mode regression suite
        run: npm run test:hardened

      - name: Dual-mode security regression proof
        run: npm run test:proof

      - name: Workspace production build
        run: npm run build --workspaces --if-present

      - name: Upload evidence summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: docs/evidence/ci-summary.json
          if-no-files-found: ignore
